<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background decorative glows -->
  <circle cx="200" cy="80" r="140" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="280" r="160" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Top branding -->
  <g transform="translate(60, 40)">
    <rect width="48" height="48" rx="12" fill="url(#accentGrad)" />
    <path d="M24 14v16.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V20h6v-6h-8z" fill="#ffffff" />
    <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="800" fill="#ffffff">MusicDownloader</text>
    <rect x="290" y="14" width="110" height="24" rx="12" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" />
    <text x="345" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">100% OPEN SOURCE</text>
  </g>

  <!-- Big Title & Subtitle -->
  <g transform="translate(60, 130)">
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="900" fill="#f8fafc">
      Scarica Musica e Video alla <tspan fill="url(#accentGrad)">Massima Qualità</tspan>
    </text>
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">
      Ricerca incrementale ad ogni tasto • Classifiche live • MP3 a 320 kbps con tag ID3 e copertina • Video MP4 in 4K/HD
    </text>
  </g>

  <!-- Mockup Preview Card: Search Bar -->
  <g transform="translate(60, 230)" filter="url(#shadow)">
    <rect width="640" height="62" rx="16" fill="#172033" stroke="rgba(99,102,241,0.5)" stroke-width="2" />
    <circle cx="36" cy="31" r="9" fill="none" stroke="#64748b" stroke-width="2.5" />
    <line x1="43" y1="38" x2="52" y2="47" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <text x="70" y="37" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#f8fafc">Eminem - Houdini</text>
    <rect x="520" y="10" width="108" height="42" rx="10" fill="url(#accentGrad)" />
    <text x="574" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Cerca</text>
  </g>

  <!-- Quick Badges -->
  <g transform="translate(60, 320)">
    <rect width="130" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
    <text x="65" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">⚡ Live Search</text>

    <g transform="translate(142, 0)">
      <rect width="180" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">🎵 MP3 320kbps + ID3</text>
    </g>

    <g transform="translate(334, 0)">
      <rect width="170" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="85" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">🎬 Video MP4 HD / 4K</text>
    </g>

    <g transform="translate(516, 0)">
      <rect width="184" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="92" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">🐳 1-Click Docker Setup</text>
    </g>
  </g>

  <!-- Right Side Mockup Card: Song Detail Card -->
  <g transform="translate(760, 60)" filter="url(#shadow)">
    <rect width="380" height="300" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Mini cover art -->
    <rect x="24" y="24" width="96" height="96" rx="12" fill="#4338ca" />
    <circle cx="72" cy="72" r="28" fill="#6366f1" opacity="0.6" />
    <polygon points="68,60 84,72 68,84" fill="#ffffff" />
    
    <!-- Song Info -->
    <text x="136" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Houdini</text>
    <text x="136" y="74" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Eminem</text>
    <rect x="136" y="86" width="76" height="22" rx="11" fill="rgba(99,102,241,0.2)" />
    <text x="174" y="101" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">3:48 • 444M</text>

    <!-- Download Buttons inside Mockup -->
    <g transform="translate(24, 145)">
      <rect width="332" height="58" rx="10" fill="linear-gradient(135deg, #4f46e5, #6366f1)" />
      <path d="M22 24v8h14v-8m-7 4v-14m-5 9l5 5 5-5" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Scarica Canzone MP3 (320 kbps)</text>
      <text x="52" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#c7d2fe">Con Copertina HD e Tag ID3 inclusi</text>
    </g>

    <g transform="translate(24, 218)">
      <rect width="332" height="58" rx="10" fill="linear-gradient(135deg, #0284c7, #0ea5e9)" />
      <path d="M22 24v8h14v-8m-7 4v-14m-5 9l5 5 5-5" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Scarica Filmato Video (MP4)</text>
      <text x="52" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#bae6fd">Massima Risoluzione Video HD / 4K</text>
    </g>
  </g>
</svg>
